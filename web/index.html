<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pakistan Environmental Analytics</title>
  <meta name="description" content="Historical PM2.5, weather and statistical insights for 339 places in Pakistan, 2018–2026 — computed from World Bank, Open-Meteo ERA5 and Kaggle datasets.">
  <meta name="theme-color" content="#0b1324">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231fb38a'/%3E%3Cstop offset='.55' stop-color='%232a78d6'/%3E%3Cstop offset='1' stop-color='%236250d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M7 20c3-6 6 2 9-4s6 0 9-5' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    try { const t = localStorage.getItem("pea-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="vendor/plotly.min.js" defer></script>
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 15c2.5-5 5 2 7.5-3s5 0 7.5-4"/><path d="M3 20h18"/></svg></div>
        <div><div class="brand-name">Pakistan Environmental Analytics</div><div class="brand-sub">Air quality · weather · statistics</div></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="topbar-row">
          <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <div class="page-title" id="page-title">Loading…</div>
          <span class="pill blue dot" title="All PM2.5 values are machine-learning model estimates">Modelled estimates</span>
          <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode" title="Toggle light / dark"></button>
        </div>
        <div class="filters" id="filters"></div>
        <div class="active-filters" id="active-filters"></div>
      </header>
      <main class="content" id="content">
        <div class="loading"><div><div class="spinner"></div><div id="load-msg">Loading datasets…</div></div></div>
      </main>
    </div>
  </div>
</body>
</html>
