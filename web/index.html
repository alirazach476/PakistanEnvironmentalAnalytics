<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pakistan Environmental Analytics</title>
  <meta name="description" content="Historical PM2.5, weather and statistical insights for 339 places in Pakistan, 2018–2026 — computed from World Bank, Open-Meteo ERA5 and Kaggle datasets.">
  <meta name="theme-color" content="#06241f">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="apple-touch-icon" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    try { const t = localStorage.getItem("pea-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="vendor/plotly.min.js" defer></script>
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img class="brand-logo" src="assets/logo.svg" width="48" height="48" alt="Pakistan Environmental Analytics logo">
        <div class="brand-text">
          <div class="brand-name">Pakistan Environmental Analytics</div>
          <div class="brand-sub">Air · weather · statistics</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="topbar-row">
          <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <div class="page-title" id="page-title">Loading…</div>
          <span class="pill teal dot" title="All PM2.5 values are machine-learning model estimates">Modelled estimates</span>
          <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode" title="Toggle light / dark"></button>
        </div>
        <div class="filters" id="filters"></div>
        <div class="active-filters" id="active-filters"></div>
      </header>
      <main class="content" id="content">
        <div class="loading"><div><div class="spinner"></div><div id="load-msg">Loading datasets…</div></div></div>
      </main>
    </div>
  </div>
</body>
</html>
